# Every push and pull request: the content builds and Content.lua is up to
# date with it, and the addon passes its simulation.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get install -y -qq luajit
      - name: Content builds, Content.lua is up to date
        run: bun scripts/build.ts --check
      - name: Simulation
        run: luajit addon/test/sim.lua
