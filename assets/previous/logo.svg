<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="leather" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#4a2c17"/>
      <stop offset="0.6" stop-color="#2b170b"/>
      <stop offset="1" stop-color="#140904"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dd8a"/>
      <stop offset="0.5" stop-color="#d4a637"/>
      <stop offset="1" stop-color="#8a6116"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9c08a"/>
      <stop offset="0.8" stop-color="#f1e2bb"/>
      <stop offset="1" stop-color="#b99a5e"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#d9c08a"/>
      <stop offset="0.8" stop-color="#f1e2bb"/>
      <stop offset="1" stop-color="#b99a5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6dd8a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6dd8a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- leather ground and gilded frame -->
  <rect width="512" height="512" fill="url(#leather)"/>
  <rect x="18" y="18" width="476" height="476" rx="10" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <rect x="32" y="32" width="448" height="448" rx="6" fill="none" stroke="#d4a637" stroke-opacity="0.55" stroke-width="2"/>
  <g fill="#d4a637" opacity="0.8">
    <path d="M32 52 L52 32 L58 38 L38 58 Z"/>
    <path d="M480 52 L460 32 L454 38 L474 58 Z"/>
    <path d="M32 460 L52 480 L58 474 L38 454 Z"/>
    <path d="M480 460 L460 480 L454 474 L474 454 Z"/>
  </g>

  <!-- compass rose behind the book -->
  <circle cx="256" cy="196" r="150" fill="url(#glow)"/>
  <g transform="translate(256 196)">
    <circle r="112" fill="none" stroke="#d4a637" stroke-opacity="0.6" stroke-width="3"/>
    <circle r="100" fill="none" stroke="#d4a637" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 7"/>
    <g fill="url(#gold)" stroke="#6b4a10" stroke-width="1.5">
      <path d="M0 -150 L18 -18 L0 0 Z"/><path d="M0 -150 L-18 -18 L0 0 Z" fill="#9c7020"/>
      <path d="M150 0 L18 18 L0 0 Z"/><path d="M150 0 L18 -18 L0 0 Z" fill="#9c7020"/>
      <path d="M0 150 L-18 18 L0 0 Z"/><path d="M0 150 L18 18 L0 0 Z" fill="#9c7020"/>
      <path d="M-150 0 L-18 -18 L0 0 Z"/><path d="M-150 0 L-18 18 L0 0 Z" fill="#9c7020"/>
    </g>
    <g fill="#c99a2e" opacity="0.85" transform="rotate(45)">
      <path d="M0 -92 L11 -11 L0 0 L-11 -11 Z"/>
      <path d="M92 0 L11 11 L0 0 L11 -11 Z"/>
      <path d="M0 92 L-11 11 L0 0 L11 11 Z"/>
      <path d="M-92 0 L-11 -11 L0 0 L-11 11 Z"/>
    </g>
  </g>

  <!-- the open ledger -->
  <g transform="translate(256 330)">
    <!-- cover -->
    <path d="M-182 -64 Q-90 -84 0 -58 Q90 -84 182 -64 L190 92 Q96 70 0 96 Q-96 70 -190 92 Z" fill="#5a1d14" stroke="#2a0c08" stroke-width="3"/>
    <!-- page stacks -->
    <path d="M-170 -70 Q-86 -92 -4 -62 L-4 84 Q-86 58 -176 78 Z" fill="#a8895a"/>
    <path d="M170 -70 Q86 -92 4 -62 L4 84 Q86 58 176 78 Z" fill="#a8895a"/>
    <!-- pages -->
    <path d="M-164 -78 Q-84 -100 -4 -70 L-4 76 Q-84 50 -168 68 Z" fill="url(#pageL)" stroke="#7d5c2c" stroke-width="1.5"/>
    <path d="M164 -78 Q84 -100 4 -70 L4 76 Q84 50 168 68 Z" fill="url(#pageR)" stroke="#7d5c2c" stroke-width="1.5"/>
    <!-- spine shadow -->
    <path d="M-12 -68 Q0 -62 12 -68 L12 78 Q0 84 -12 78 Z" fill="#6b4a22" opacity="0.45"/>
    <!-- writing -->
    <g stroke="#6b4a22" stroke-width="3" stroke-linecap="round" opacity="0.75" fill="none">
      <path d="M-140 -60 Q-80 -74 -28 -54"/>
      <path d="M-142 -38 Q-82 -52 -28 -32"/>
      <path d="M-144 -16 Q-84 -30 -28 -10"/>
      <path d="M-146 6 Q-86 -8 -28 12"/>
      <path d="M-148 28 Q-90 14 -60 22"/>
      <path d="M140 -60 Q80 -74 28 -54"/>
      <path d="M142 -38 Q82 -52 28 -32"/>
      <path d="M144 -16 Q84 -30 28 -10"/>
      <path d="M146 6 Q86 -8 28 12"/>
      <path d="M148 28 Q100 14 60 22"/>
    </g>
    <!-- a small compass sigil on the right page -->
    <g transform="translate(96 46)" fill="#8a3a1c" opacity="0.8">
      <path d="M0 -14 L4 -4 L0 0 L-4 -4 Z M14 0 L4 4 L0 0 L4 -4 Z M0 14 L-4 4 L0 0 L4 4 Z M-14 0 L-4 -4 L0 0 L-4 4 Z"/>
    </g>
    <!-- ribbon -->
    <path d="M-6 78 L-6 136 L6 124 L18 136 L18 80 Z" fill="#9b1f1f" stroke="#4a0c0c" stroke-width="1.5"/>
  </g>
</svg>
